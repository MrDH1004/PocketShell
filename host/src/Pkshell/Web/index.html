<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PocketShell">
<title>PocketShell</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="pair" class="view" hidden>
  <form id="pair-form" class="card pair-card" autocomplete="off">
    <img src="icon-192.png" alt="" class="logo" width="56" height="56">
    <h1>PocketShell 연결</h1>
    <p class="muted">PC 트레이 메뉴 → <b>휴대폰 연결 (PIN)</b>에 표시된 6자리 PIN 입력.</p>
    <label for="pin">PIN</label>
    <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required autofocus>
    <label for="device-name">이 기기 이름</label>
    <input id="device-name" name="device-name" maxlength="60" required>
    <p id="pair-error" class="error" role="alert"></p>
    <button type="submit" class="primary" id="pair-submit">연결</button>
  </form>
</main>

<main id="list" class="view" hidden>
  <header class="bar">
    <div class="bar-title">
      <b id="pc-name">PC</b>
      <span id="pc-meta" class="muted"></span>
    </div>
    <div class="bar-actions">
      <button type="button" id="new-session" class="primary">새 세션</button>
      <button type="button" id="install" hidden>앱 설치</button>
      <button type="button" id="refresh" class="ghost" aria-label="새로 고침">↻</button>
      <button type="button" id="unpair" class="ghost">연결 해제</button>
    </div>
  </header>
  <p id="list-error" class="error banner" role="alert" hidden></p>
  <div id="sections" class="sections"></div>
</main>

<main id="term" class="view" hidden>
  <header class="bar term-bar">
    <button type="button" id="back" class="ghost" aria-label="세션 목록">← 목록</button>
    <div class="bar-title">
      <b id="term-title"></b>
      <span id="term-cwd" class="muted"></span>
    </div>
    <span id="term-status" class="status" role="status"></span>
    <div class="term-tools">
      <button type="button" class="icon" id="tool-image" aria-label="사진 첨부" title="사진 첨부 (PC 클립보드 → Alt+V)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
      <button type="button" class="icon" id="tool-file" aria-label="파일 올리기" title="파일 올리기 (세션 폴더)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></button>
      <button type="button" class="icon" id="tool-files" aria-label="파일 탐색기" title="파일 탐색기 (세션 폴더)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <button type="button" class="icon" id="tool-fit" aria-label="화면 맞춤" title="화면 맞춤"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
      <button type="button" class="icon" id="tool-keyboard" aria-label="키보드" title="키보드 열기·닫기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
    </div>
    <input type="file" id="pick-image" accept="image/*" multiple hidden>
    <input type="file" id="pick-file" multiple hidden>
  </header>
  <div id="term-wrap">
    <div id="term-box"></div>
    <p id="conn-banner" class="conn-banner" role="alert" hidden></p>
    <button type="button" id="to-live" class="to-live" hidden>↓ 실시간</button>
  </div>
  <div id="quickbar" class="quickbar" hidden></div>
  <div id="keybar" class="keybar" hidden>
    <button type="button" data-key="esc">Esc</button>
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="enter" aria-label="Enter">↵</button>
    <button type="button" data-key="snippets">문구</button>
    <button type="button" data-key="ctrl" id="ctrl-key" aria-pressed="false">Ctrl</button>
    <button type="button" data-key="alt" id="alt-key" aria-pressed="false">Alt</button>
    <button type="button" data-key="left" aria-label="왼쪽">←</button>
    <button type="button" data-key="up" aria-label="위">↑</button>
    <button type="button" data-key="down" aria-label="아래">↓</button>
    <button type="button" data-key="right" aria-label="오른쪽">→</button>
    <button type="button" data-key="slash">/</button>
    <button type="button" data-key="pipe">|</button>
    <button type="button" data-key="tilde">~</button>
    <button type="button" data-key="minus">-</button>
    <button type="button" data-key="home">Home</button>
    <button type="button" data-key="end">End</button>
    <button type="button" data-key="pgup">PgUp</button>
    <button type="button" data-key="pgdn">PgDn</button>
  </div>
</main>

<main id="files" class="view" hidden>
  <header class="bar files-bar">
    <button type="button" id="files-back" class="ghost" aria-label="터미널로">← 터미널</button>
    <div class="bar-title">
      <b>파일</b>
      <span id="files-path" class="muted"></span>
    </div>
    <button type="button" class="icon" id="files-up" aria-label="상위 폴더" title="상위 폴더"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
    <button type="button" class="icon" id="files-places" aria-label="PC 위치" title="PC 위치 (드라이브·폴더)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
  </header>
  <div class="files-tools">
    <input id="files-search" type="search" placeholder="이 폴더에서 찾기" aria-label="이 폴더에서 찾기" spellcheck="false">
    <button type="button" id="files-sort">정렬</button>
    <button type="button" id="files-upload">올리기</button>
    <button type="button" id="files-newfolder">새 폴더</button>
    <button type="button" id="files-newfile">새 파일</button>
    <button type="button" id="files-paste" hidden>붙여넣기</button>
    <button type="button" id="files-refresh" class="ghost" aria-label="새로 고침">↻</button>
    <input type="file" id="files-pick" multiple hidden>
  </div>
  <div id="files-selbar" class="files-selbar" hidden>
    <span id="files-selcount"></span>
    <button type="button" id="files-sel-copy">복사</button>
    <button type="button" id="files-sel-cut">잘라내기</button>
    <button type="button" id="files-sel-delete" class="danger">삭제</button>
    <button type="button" id="files-sel-all" class="ghost">모두</button>
    <button type="button" id="files-sel-clear" class="ghost">해제</button>
  </div>
  <p id="files-summary" class="muted files-summary"></p>
  <ul id="files-list" class="files-list"></ul>
  <p id="files-msg" class="empty files-msg"></p>
</main>

<dialog id="files-sheet" aria-labelledby="files-sheet-title">
  <h2 id="files-sheet-title"></h2>
  <div id="files-sheet-items" class="sheet-items"></div>
  <div class="row-end"><button type="button" id="files-sheet-cancel">닫기</button></div>
</dialog>

<dialog id="files-ask" aria-labelledby="files-ask-title">
  <form id="files-ask-form">
    <h2 id="files-ask-title"></h2>
    <input id="files-ask-input" spellcheck="false" aria-labelledby="files-ask-title">
    <div class="row-end">
      <button type="button" id="files-ask-cancel">취소</button>
      <button type="submit" class="primary" id="files-ask-ok">확인</button>
    </div>
  </form>
</dialog>

<dialog id="files-preview" class="preview" aria-labelledby="files-preview-title">
  <div class="preview-head">
    <div class="bar-title"><b id="files-preview-title"></b><span id="files-preview-sub" class="muted"></span></div>
    <button type="button" id="files-preview-download">다운로드</button>
    <button type="button" id="files-preview-close" class="primary">닫기</button>
  </div>
  <div id="files-preview-body" class="preview-body"></div>
</dialog>

<dialog id="snip-dialog" aria-labelledby="snip-title">
  <h2 id="snip-title">자주 쓰는 문구</h2>
  <p class="muted small">누르면 입력줄에 넣고 기다림. 고치거나 Enter로 보내기.</p>
  <div id="snip-items" class="sheet-items"></div>
  <div class="row-end">
    <button type="button" id="snip-edit">문구 편집…</button>
    <button type="button" class="primary" id="snip-close">닫기</button>
  </div>
</dialog>

<dialog id="snip-edit-dialog" aria-labelledby="snip-edit-title">
  <form id="snip-edit-form">
    <h2 id="snip-edit-title">문구 편집</h2>
    <p class="muted small">한 줄에 하나씩 (최대 20개, 한 줄 200자). 이 브라우저에 저장됨.</p>
    <textarea id="snip-text" rows="8" spellcheck="false" aria-labelledby="snip-edit-title"></textarea>
    <div class="row-end">
      <button type="button" id="snip-edit-cancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<dialog id="new-dialog">
  <form method="dialog" id="new-form">
    <h2>새 세션</h2>
    <label for="new-cwd">폴더</label>
    <input id="new-cwd" list="new-roots" placeholder="C:\Users\me\project" spellcheck="false">
    <datalist id="new-roots"></datalist>
    <label for="new-agent">시작할 AI CLI</label>
    <select id="new-agent"><option value="">없음 (셸만)</option></select>
    <p id="new-error" class="error" role="alert"></p>
    <div class="row-end">
      <button type="button" class="ghost" id="new-cancel">취소</button>
      <button type="submit" class="primary" id="new-ok">세션 시작</button>
    </div>
  </form>
</dialog>

<dialog id="install-dialog" aria-labelledby="install-title">
  <h2 id="install-title">앱 설치</h2>
  <p class="muted">앱처럼 아이콘으로 바로 열기. 주소창 없이 전체 화면으로 열림.</p>
  <ol id="install-steps" class="steps"></ol>
  <p id="install-note" class="muted small"></p>
  <div class="row-end">
    <a id="install-open" class="btn primary" hidden>Tailscale 주소로 열기</a>
    <button type="button" id="install-close">닫기</button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="reflow.js"></script>
<script src="files.js"></script>
<script src="app.js"></script>
</body>
</html>
